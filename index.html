<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daloy - Free Water PH</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <h1>💧 Daloy</h1>
        <div class="tabs">
            <button class="tab-btn active" data-target="map-view">Map</button>
            <button class="tab-btn" data-target="add-view">Add Water</button>
        </div>
    </header>

    <main>
        <!-- MAP MODULE -->
        <section id="map-view" class="module active">
            <div id="map"></div>
        </section>

        <!-- ADD LOCATION MODULE -->
        <section id="add-view" class="module">
            <div class="card">
                <h2>Add a Hydration Spot</h2>
                <p class="subtitle">Help others find free drinking water!</p>
                
                <form id="add-location-form">
                    <div class="form-group">
                        <label>Location Name</label>
                        <input type="text" id="loc-name" placeholder="e.g. SM North EDSA Fountain" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Type</label>
                            <select id="loc-type">
                                <option value="Water Fountain">Water Fountain</option>
                                <option value="Restaurant">Restaurant (Service Water)</option>
                                <option value="Refilling Station">Refilling Station</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Setting</label>
                            <select id="loc-setting">
                                <option value="Indoor">Indoor</option>
                                <option value="Outdoor">Outdoor</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Access</label>
                        <select id="loc-access">
                            <option value="Public">Public (Anyone)</option>
                            <option value="Customers Only">Customers Only</option>
                            <option value="Restricted">Restricted</option>
                        </select>
                    </div>

                    <fieldset class="location-details">
                        <legend>Address Details</legend>
                        <input type="text" id="loc-building" placeholder="Building / Mall Name">
                        <div class="form-row">
                            <input type="text" id="loc-floor" placeholder="Floor Level">
                            <input type="text" id="loc-street" placeholder="Street Name">
                        </div>
                    </fieldset>

                    <div class="form-group">
                        <label>Coordinates (Tap map to set)</label>
                        <input type="text" id="loc-coords" placeholder="Latitude, Longitude" readonly required>
                    </div>

                    <div class="form-group">
                        <label>Photo Proof</label>
                        <input type="file" id="loc-image" accept="image/*" required>
                    </div>

                    <div class="form-group">
                        <label>Notes / Instructions</label>
                        <textarea id="loc-notes" placeholder="e.g. Bring your own tumbler, near the restrooms."></textarea>
                    </div>

                    <button type="submit" id="submit-btn" class="btn-primary">Submit Location</button>
                </form>
            </div>
        </section>
    </main>

    <!-- Dependencies -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Application Scripts -->
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/imgur.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
